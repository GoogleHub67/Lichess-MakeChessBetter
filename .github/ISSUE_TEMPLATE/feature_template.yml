name: 🚀 Feature Request
description: Suggest a new idea, feature, or enhancement for the adaptive chess bot
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thank you for proposing an enhancement!
        Please fill out the form below to help us understand your idea and how it fits into the chess engine framework.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: Provide a clear and concise description of what the current limitations are.
      placeholder: E.g., The bot resigns too quickly in positions where it could technically fight a little longer...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: Provide a clear and concise description of what you want to happen. How should the code or engine behavior change?
      placeholder: E.g., Add an adjustable padding threshold to the predictive resignation function in error.py...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: List any alternative solutions or features you've thought about.
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the system does this feature mostly impact?
      options:
        - "Core Bot Logic (src/bot)"
        - "Dynamic ELO / CPL Matrix Calculations"
        - "Engine Binaries (Stockfish / Fairy-Stockfish)"
        - "Configuration & Environments (.env / config.yml)"
        - "Dashboard / UI Integration"
        - "Other / Unsure"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, match links from Lichess, mockups, or logs about the feature request here.
    validations:
      required: false
