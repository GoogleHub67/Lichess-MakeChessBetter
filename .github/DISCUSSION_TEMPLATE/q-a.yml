name: Q&A / Support
description: Ask a question about setting up, configuring, or playing the bot
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        Stuck on setup or confused about a feature? Ask your question below and the community will help!
  - type: textarea
    id: question-content
    attributes:
      label: What is your question?
      description: State your question clearly.
      placeholder: E.g., How do I point the config to my local Fairy-Stockfish binary?
    validations:
      required: true
  - type: textarea
    id: environment-details
    attributes:
      label: Environment Details (Optional)
      description: If relevant, share your OS, Python version, or engine version.
      placeholder: E.g., Windows 11, Python 3.11, Stockfish 16
    validations:
      required: false
