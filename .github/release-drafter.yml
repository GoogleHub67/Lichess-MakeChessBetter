name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🤖 Bot Core & Chess Engine'
    labels:
      - 'engine'
      - 'bot-logic'
      - 'skill-estimation'
  - title: '🌐 Lichess API & Networking'
    labels:
      - 'api'
      - 'rate-limiting'
      - 'networking'
  - title: '🚀 New Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '🛠️ CI/CD & Infrastructure'
    labels:
      - 'ci-cd'
      - 'docker'
      - 'dependencies'
  - title: '📝 Documentation'
    labels:
      - 'documentation'
      - 'docs'

version-resolver:
  major:
    labels:
      - 'breaking-change'
  minor:
    labels:
      - 'feature'
  patch:
    labels:
      - 'bug'
      - 'chore'
      - 'dependencies'
  default: patch

template: |
  ## What's Changed in this Version

  $CHANGES

  ***
  *Automated release notes powered by Release Drafter.*
