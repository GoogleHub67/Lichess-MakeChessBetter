name: Sign Desktop Assets and Publish
on:
  workflow_run:
    workflows: ["Build All Cross-Platform Chess Assets"]
    types:
      - completed

permissions:
  contents: write
  id-token: write # CRITICAL: Required for Sigstore keyless OIDC token generation

jobs:
  sign-and-release:
    name: Sign Assets on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: windows-assets
            release_zip: windows-assets-signed.zip
          - os: ubuntu-latest
            artifact_name: linux-assets
            release_zip: linux-assets-signed.zip
          - os: macos-latest
            artifact_name: macos-assets
            release_zip: macos-assets-signed.zip
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. EXTRACT PRE-BUILT RUNNER ARTIFACTS ---
      - name: Fetch Compiled Build Assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./downloaded-temp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare Staging Workspace
        shell: bash
        run: |
          mkdir -p ./output
          cp -R ./downloaded-temp/* ./output/ 2>/dev/null || cp -R ./downloaded-temp/. ./output/
          rm -rf ./downloaded-temp

      # --- 2. WINDOWS CODESIGNING LAYER (SIGNPATH AUTHENTICODE) ---
      - name: Upload Unsigned Windows Bundle to Pipeline
        if: matrix.os == 'windows-latest'
        id: upload_unsigned_artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-assets-signing
          path: ./output
          retention-days: 1

      - name: Sign Windows Executables via SignPath
        if: matrix.os == 'windows-latest'
        uses: SignPath/github-action-submit-signing-request@v1.1.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: 'lichess-makechessbetter' # UPDATED: Matches your exact SignPath project name
          signing-policy-slug: 'release-signing'
          github-artifact-id: ${{ steps.upload_unsigned_artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './signed-output-dir'

      - name: Swap Out Staged Folder with Signed Version
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          rm -rf ./output
          mv ./signed-output-dir ./output

      # --- 3. LINUX/MAC CODESIGNING LAYER (SIGSTORE COSIGN) ---
      - name: Install Cosign Engine (Linux/Mac Only)
        if: matrix.os != 'windows-latest'
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Linux/Mac Distribution Files
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd ./output
          find . -type f ! -name "*.sigstore.json" -maxdepth 2 | while read -r target_file; do
            echo "Generating signature receipt for: $target_file"
            cosign sign-blob "$target_file" --bundle "$target_file.sigstore.json" --tlog-upload=true
          done
          cd ..

      # --- 4. PACKAGE MATRIX GROUPS FOR ACCESSIBLE DOWNLOADS ---
      - name: Zip Production Distributions
        shell: bash
        run: |
          cd ./output
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell Compress-Archive -Path * -DestinationPath ../${{ matrix.release_zip }} -Force
          else
            zip -r ../${{ matrix.release_zip }} ./*
          fi
          cd ..

      # --- 5. ATTACH FINISHED ARCHIVES DIRECTLY TO THE GITHUB RELEASE ---
      - name: Upload Signed Production Packages to Release Page
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release_zip }}
          tag_name: ${{ github.event.workflow_run.head_branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
