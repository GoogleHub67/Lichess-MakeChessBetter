name: Update Directory Trees

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub

jobs:
  update-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          path: main-repo

      # Corrected URL construction without syntax-breaking backslashes
      - name: Checkout Wiki Repository
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki-repo
        continue-on-error: true

      - name: Generate File System Tree
        run: |
          echo "GENERATED_TREE<<EOF" >> $GITHUB_ENV
          cd main-repo
          # Scans structural content folders without polluting lists with hidden configuration directories
          find . -not -path '*/.*' | sort | sed 's/[^\/]*\//|-- /g;s/|-- |-- /|   |-- /g' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Inject Tree Into Markdown
        shell: python
        run: |
          import os

          # Target array pointing directly to main code and isolated flat wiki targets
          files = [
              "./main-repo/docs/Advanced‐Directory‐Mapping.md",
              "./wiki-repo/Advanced‐Directory‐Mapping.md"
          ]
          
          tree_content = os.environ.get('GENERATED_TREE', '')
          formatted_tree = f"### Complete File System Tree\n\n```text\n{tree_content}\n```\n"

          for file_path in files:
              if not os.path.exists(file_path):
                  print(f"Skipping missing file path: {file_path}")
                  continue
                  
              with open(file_path, "r", encoding="utf-8") as f:
                  content = f.read()

              target_header = "### Complete File System Tree"
              if target_header in content:
                  parts = content.split(target_header)
                  before = parts[0]
                  after = parts[1]
                  
                  if "```text" in after:
                      after_parts = after.split("```", 2)
                      if len(after_parts) >= 3:
                          after = after_parts[2]

                  new_content = before + formatted_tree + after
                  
                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"Successfully injected map into: {file_path}")
              else:
                  print(f"Target header block anchor missing in: {file_path}")

      - name: Commit and Push Main Repo Changes
        run: |
          cd main-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. Fetch remote changes and reset your workspace to match origin perfectly
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          
          # 2. Write out a clean, temporary Python execution asset script file
          cat << 'EOF' > update_tree.py
          import os
          file_path = "docs/Advanced‐Directory‐Mapping.md"
          tree_content = os.environ.get("GENERATED_TREE", "")
          formatted_tree = f"### Complete File System Tree\n\n```text\n{tree_content}\n```\n"

          if os.path.exists(file_path):
              with open(file_path, "r", encoding="utf-8") as f:
                  content = f.read()
              
              target_header = "### Complete File System Tree"
              if target_header in content:
                  parts = content.split(target_header)
                  before = parts[0]
                  after = parts[1]
                  
                  if "```text" in after:
                      after_parts = after.split("```", 2)
                      if len(after_parts) >= 3:
                          after = after_parts[2]
                          
                  new_content = before + formatted_tree + after
                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print("Markdown file tracking layout tree updated successfully.")
          EOF
          
          # 3. Execute the dedicated Python routine safely and wipe the temp file
          python update_tree.py
          rm update_tree.py
          
          # 4. Add, commit, and push directly without needing a rebase step
          git add docs/Advanced‐Directory‐Mapping.md
          if git diff --staged --quiet; then
            echo "No changes found inside main codebase workspace."
          else
            git commit -m "chore: automated 6-hour directory map refresh [skip ci]"
            git push origin HEAD:main
          fi

      - name: Commit and Push Wiki Changes
        run: |
          if [ -d "wiki-repo" ]; then
            cd wiki-repo
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@://github.com"
            
            git add Advanced‐Directory‐Mapping.md
            
            if git diff --staged --quiet; then
              echo "No structural adjustments detected inside the wiki scope."
            else
              git commit -m "chore: automated 6-hour directory map refresh"
              
              # Wipes out all other unstaged CRLF line-ending noise across the wiki directory
              git checkout .
              
              git pull origin HEAD --rebase
              git push origin HEAD
            fi
          else
            echo "Wiki repository directory not present. Skipping."
          fi

      - name: Commit and Push Wiki Changes
        run: |
          # Only run if wiki-repo directory was successfully cloned
          if [ -d "wiki-repo" ]; then
            cd wiki-repo
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            git add Advanced‐Directory‐Mapping.md
            if git diff --staged --quiet; then
              echo "No structural adjustments detected inside the wiki scope."
            else
              git commit -m "chore: automated 6-hour directory map refresh"
              git push origin HEAD
            fi
          else
            echo "Wiki repository directory not present. Skipping."
          fi
