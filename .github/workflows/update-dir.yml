name: Update Directory Trees

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub

jobs:
  update-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout Wiki Repository
        run: |
          git clone "https://x-access-token:\({{ secrets.GITHUB_TOKEN }}@://github.com\){{ github.repository }}.wiki.git" wiki-repo
        continue-on-error: true

      - name: Generate File System Tree
        run: |
          echo "GENERATED_TREE<<EOF" >> \$GITHUB_ENV
          cd main-repo
          
          python -c '
          import os

          tree_lines = []
          # Recursively traverse directory structures natively
          for root, dirs, files in os.walk(".", topdown=True):
              # Ignore core system tracking frameworks
              if ".git" in dirs:
                  dirs.remove(".git")
              
              # Sort strategy: Hidden items first (.A, .B) then standard items (A, B) alphabetical
              dirs.sort(key=lambda x: (not x.startswith("."), x.lower()))
              files.sort(key=lambda x: (not x.startswith("."), x.lower()))
              
              # Calculate correct indentation depth relative to workspace root
              if root == ".":
                  depth = 0
              else:
                  depth = root.replace("./", "").count(os.sep) + 1
                  
              indent = "|   " * (depth - 1) if depth > 0 else ""
              
              if root != ".":
                  folder_name = os.path.basename(root)
                  tree_lines.append(f"{indent}|-- {folder_name}/")
                  indent += "|   "
              
              for file in files:
                  tree_lines.append(f"{indent}|-- {file}")
          
          print("\n".join(tree_lines))
          ' >> \$GITHUB_ENV
          echo "EOF" >> \$GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Commit and Push Main Repo Changes
        run: |
          cd main-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # 1. Clear out remote race conditions and mixed line endings before writing changes
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          
          # 2. Write out a clean, external Python asset script to handle string patching safely
          cat << 'EOF' > update_tree.py
import os
file_path = "docs/Advanced‐Directory‐Mapping.md"
tree_content = os.environ.get("GENERATED_TREE", "")
formatted_tree = f"### Complete File System Tree\n\n```text\n{tree_content}\n```\n"

if os.path.exists(file_path):
    with open(file_path, "r", encoding="utf-8") as f:
        content = f.read()
    
    target_header = "### Complete File System Tree"
    if target_header in content:
        parts = content.split(target_header)
        before = parts[0]
        after = parts[1]
        
        if "```text" in after:
            after_parts = after.split("```", 2)
            if len(after_parts) >= 3:
                after = after_parts[2]
                
        new_content = before + formatted_tree + after
        with open(file_path, "w", encoding="utf-8") as f:
            f.write(new_content)
        print("Markdown file tracking layout tree updated successfully.")
EOF
          
          # 3. Execute the dedicated file patching automation block and clear temp file
          python update_tree.py
          rm update_tree.py
          
          # 4. Stage your successfully modified file and push straight to main
          git add docs/Advanced‐Directory‐Mapping.md
          if git diff --staged --quiet; then
            echo "No changes found inside main codebase workspace."
          else
            git commit -m "chore: automated 6-hour directory map refresh [skip ci]"
            git push origin HEAD:main
          fi

      - name: Commit and Push Wiki Changes
        run: |
          if [ -d "wiki-repo" ]; then
            cd wiki-repo
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@://github.com"
            
            # 1. Ensure local branch sync matches up-to-date tracking variables
            git fetch origin
            git reset --hard origin/master || git reset --hard origin/main
            git clean -fd
            
            # 2. Build injection script mapping for the flat wiki target file
            cat << 'EOF' > update_wiki.py
import os
file_path = "Advanced‐Directory‐Mapping.md"
tree_content = os.environ.get("GENERATED_TREE", "")
formatted_tree = f"### Complete File System Tree\n\n```text\n{tree_content}\n```\n"

if os.path.exists(file_path):
    with open(file_path, "r", encoding="utf-8") as f:
        content = f.read()
    
    target_header = "### Complete File System Tree"
    if target_header in content:
        parts = content.split(target_header)
        before = parts[0]
        after = parts[1]
        
        if "```text" in after:
            after_parts = after.split("```", 2)
            if len(after_parts) >= 3:
                after = after_parts[2]
                
        new_content = before + formatted_tree + after
        with open(file_path, "w", encoding="utf-8") as f:
            f.write(new_content)
        print("Wiki directory tree tracking layout saved successfully.")
EOF
            
            # 3. Execute the script and clean up
            python update_wiki.py
            rm update_wiki.py
            
            git add Advanced‐Directory‐Mapping.md
            if git diff --staged --quiet; then
              echo "No structural adjustments detected inside the wiki scope."
            else
              git commit -m "chore: automated 6-hour directory map refresh"
              git push origin HEAD
            fi
          else
            echo "Wiki repository workspace directory not detected. Skipping step."
          fi
