name: Auto Changelog CI

on:
  push:
    branches:
      - main  # Change to master if your default branch is different

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetches the current and previous commit to calculate the actual diff

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve & 
          sleep 5 # Give the background service a few seconds to boot up

      - name: Pull Qwen Coder Model
        run: ollama pull qwen2.5-coder:1.5b # Using 1.5b as it downloads very quickly in CI, but you can use 7b if needed

      - name: Generate Changelog with Local AI
        run: |
          # 1. Get the actual code diff of the latest push
          DIFF=$(git diff HEAD~1 HEAD)

          if [ -z "$DIFF" ]; then
              echo "No code changes detected."
              exit 0
          fi

          # 2. Structure the prompt cleanly for Qwen
          PROMPT="You are an expert developer. Analyze the following raw git diff of code changes. 
          Write a concise, human-friendly changelog entry in Markdown.
          Group items by Added, Changed, or Fixed. Do not use technical jargon or internal variable names.
          Keep it punchy.

          Git Diff:
          $DIFF"

          # Escape formatting safely for JSON
          JSON_PROMPT=$(echo "$PROMPT" | jq -aR .)

          # 3. Call the Ollama API running inside the GitHub worker
          echo "🤖 Cloud-hosted Qwen is analyzing code changes..."
          AI_ENTRY=$(curl -s http://localhost:11434/api/generate -d "{
            \"model\": \"qwen2.5-coder:1.5b\",
            \"prompt\": $JSON_PROMPT,
            \"stream\": false
          }" | jq -r '.response')

          # 4. Prepend to CHANGELOG.md file
          CHANGELOG_FILE="CHANGELOG.md"
          DATE=$(date +%Y-%m-%d)
          NEW_ENTRY=$'\n\n'"## [$DATE] - AI Generated"$'\n'"$AI_ENTRY"

          if [ -f "$CHANGELOG_FILE" ]; then
              echo "$NEW_ENTRY" | cat - "$CHANGELOG_FILE" > temp && mv temp "$CHANGELOG_FILE"
          else
              echo -e "# Changelog\n$NEW_ENTRY" > "$CHANGELOG_FILE"
          fi

      - name: Commit & Push Changelog
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md
          git commit -m "chore: auto-update CHANGELOG.md [skip ci]" || echo "No changes to commit"
          git push
