name: Auto Changelog CI

on:
  push:
    branches:
      - main  # Change to master if your default branch is different

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetches current and previous commit for the diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          
          # Wait up to 30 seconds for Ollama to become responsive
          echo "Waiting for Ollama to start..."
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is ready!"
              break
            fi
            sleep 1
          done

      - name: Pull Qwen Coder Model
        run: ollama pull qwen2.5-coder:1.5b

      - name: Generate Changelog with Local AI
        run: |
          python -c "
          import os
          import subprocess
          import json
          import urllib.request
          from datetime import datetime

          # 1. Get code diff
          try:
              diff = subprocess.check_output(['git', 'diff', 'HEAD~1', 'HEAD']).decode('utf-8')
          except Exception as e:
              print(f'Error getting git diff: {e}')
              exit(0)

          if not diff.strip():
              print('No code changes detected.')
              exit(0)

          # 2. Prepare Prompt
          prompt = f'''You are an expert developer. Analyze the following raw git diff of code changes. 
          Write a concise, human-friendly changelog entry in Markdown format.
          Group items by Added, Changed, or Fixed. Do not use technical jargon or internal variable names.
          Keep it punchy.

          Git Diff:
          {diff}'''

          # 3. Call Ollama API using Python's native utilities
          url = 'http://localhost:11434/api/generate'
          data = json.dumps({
              'model': 'qwen2.5-coder:1.5b',
              'prompt': prompt,
              'stream': False
          }).encode('utf-8')

          req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})
          
          try:
              with urllib.request.urlopen(req) as response:
                  res_data = json.loads(response.read().decode('utf-8'))
                  ai_entry = res_data.get('response', '').strip()
          except Exception as e:
              ai_entry = f'Error generating entry from Qwen: {str(e)}'

          if not ai_entry:
              ai_entry = 'No changes could be parsed by the model.'

          # 4. Update CHANGELOG.md
          changelog_file = 'CHANGELOG.md'
          existing_content = ''
          if os.path.exists(changelog_file):
              with open(changelog_file, 'r') as f:
                  existing_content = f.read()

          today = datetime.now().strftime('%Y-%m-%d')
          new_entry = f'\n\n## [{today}] - AI Generated\n{ai_entry}\n'

          with open(changelog_file, 'w') as f:
              f.write(new_entry + existing_content)
          "

      - name: Commit & Push Changelog
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md
          git commit -m "chore: auto-update CHANGELOG.md [skip ci]" || echo "No changes to commit"
          git push
