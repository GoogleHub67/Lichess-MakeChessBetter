name: "Copilot Setup Steps"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Installs Python so Copilot assistants can test scripts natively
      - name: Configure Python Runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Installs your linter so your agents don't generate messy code
      - name: Sync Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # Installs your project requirements so Copilot can safely run imports
      - name: Build Application Context
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install .
          else
            echo "No package manifest detected. Processing workspace as-is."
          fi
