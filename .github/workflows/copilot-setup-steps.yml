name: Copilot Setup Steps
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # The job name must be exactly 'copilot-setup-steps' for the agent to recognize it
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up subsequent pipeline runs

      - name: Install Linting & Core Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Verify Environment Configuration
        run: |
          python --version
          ruff --version

      - name: Install Application Dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install .
          else
            echo "No dependency manifest file discovered. Skipping package installation."
          fi
