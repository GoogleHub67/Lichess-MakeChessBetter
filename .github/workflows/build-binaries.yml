name: Build All 6 Cross-Platform Chess Assets
on: [push, workflow_dispatch]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: windows-assets
            target_os: windows
          - os: ubuntu-latest
            artifact_name: linux-assets
            target_os: linux
          - os: macos-latest
            artifact_name: macos-assets
            target_os: macos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cython setuptools

      # --- 1. COMPILE NATIVE LIBRARIES (Cython Setup Fixed) ---
      - name: Compile Library Module
        run: |
          python -c "
          from setuptools import setup, Extension
          from Cython.Build import cythonize
          import sys
          
          setup(
              ext_modules=cythonize(Extension('makechessbetter', ['src/bot.py'])),
              script_args=['build_ext', '--inplace']
          )
          "

      # --- 2. COMPILE APPS (PyInstaller) ---
      - name: Build Standalone Application (Windows)
        if: matrix.target_os == 'windows'
        run: pyinstaller --onefile --name=makechessbetter src/bot.py

      - name: Build Standalone Application (Linux)
        if: matrix.target_os == 'linux'
        run: pyinstaller --onefile --name=makechessbetter-linux src/bot.py

      - name: Build Standalone Application (Mac)
        if: matrix.target_os == 'macos'
        run: pyinstaller --onefile --name=makechessbetter-mac src/bot.py

      # --- 3. FORMAT AND STAGE ASSETS FOR UPLOAD ---
      - name: Stage Assets (Windows)
        if: matrix.target_os == 'windows'
        shell: powershell
        run: |
          mkdir output
          if (Test-Path "dist/makechessbetter.exe") { Move-Item dist/makechessbetter.exe output/makechessbetter.exe }
          Get-ChildItem -Path . -Filter *.pyd -Recurse | ForEach-Object {
              if ($_.DirectoryName -ne (Get-Item output).FullName) {
                  Move-Item $_.FullName output/makechessbetter.pyd -Force
              }
          }

      - name: Stage Assets (Linux)
        if: matrix.target_os == 'linux'
        run: |
          mkdir output
          [ -f dist/makechessbetter-linux ] && mv dist/makechessbetter-linux output/makechessbetter-linux
          find . -name "*.so" -exec cp {} output/makechessbetter.so \;

      - name: Stage Assets (Mac)
        if: matrix.target_os == 'macos'
        run: |
          mkdir output
          [ -f dist/makechessbetter-mac ] && mv dist/makechessbetter-mac output/makechessbetter-mac
          find . -name "*.so" -exec cp {} output/makechessbetter.so \;

      # --- 4. UPLOAD ZIP ARTIFACTS ---
      - name: Upload Finished Assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: output/
          if-no-files-found: error
