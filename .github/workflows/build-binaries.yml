name: Build All 6 Cross-Platform Chess Assets
on: [push, workflow_dispatch]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: windows-assets
            target_os: windows
            pyi_name: makechessbetter
            binary_ext: .exe
            lib_ext: .pyd
            sf_url: "h t t p s : / / g i t h u b . c o m / o f f i c i a l - s t o c k f i s h / S t o c k f i s h / r e l e a s e s / l a t e s t / d o w n l o a d / s t o c k f i s h - w i n d o w s - x 8 6 - 6 4 - a v x 2 . z i p"
            sf_binary: "stockfish/stockfish-windows-x86-64-avx2.exe"
            sf_dest: "stockfish.exe"
          - os: ubuntu-latest
            artifact_name: linux-assets
            target_os: linux
            pyi_name: makechessbetter-linux
            binary_ext: ''
            lib_ext: .so
            sf_url: "h t t p s : / / g i t h u b . c o m / o f f i c i a l - s t o c k f i s h / S t o c k f i s h / r e l e a s e s / l a t e s t / d o w n l o a d / s t o c k f i s h - u b u n t u - x 8 6 - 6 4 - a v x 2 . t a r . g z"
            sf_binary: "stockfish/stockfish-ubuntu-x86-64-avx2"
            sf_dest: "stockfish"
          - os: macos-latest
            artifact_name: macos-assets
            target_os: macos
            pyi_name: makechessbetter-mac
            binary_ext: ''
            lib_ext: .so
            sf_url: "h t t p s : / / g i t h u b . c o m / o f f i c i a l - s t o c k f i s h / S t o c k f i s h / r e l e a s e s / l a t e s t / d o w n l o a d / s t o c k f i s h - m a c o s - x 8 6 - 6 4 - a v x 2 . t a r . g z"
            sf_binary: "stockfish/stockfish-macos-x86-64-avx2"
            sf_dest: "stockfish"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Add the MSVC compiler specifically for Windows runners so Cython works
      - name: Set up MSVC (Windows Only)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # --- INSTALL DEPENDENCIES ---
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cython setuptools python-dotenv
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f src/requirements.txt ]; then pip install -r src/requirements.txt; fi
        shell: bash

      # --- 1. DOWNLOAD AND EXTRACT STOCKFISH ---
      # Remapping the spaced URL back to standard format on the fly before running curl
      - name: Fetch Cross-Platform Stockfish Engine
        run: |
          mkdir -p sf_temp
          CLEAN_URL=$(echo "${{ matrix.sf_url }}" | tr -d ' ')
          curl -L "$CLEAN_URL" -o sf_temp/sf_archive
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            unzip sf_temp/sf_archive -d sf_temp/
          else
            tar -xzf sf_temp/sf_archive -C sf_temp/
          fi
          find sf_temp -type f -name "stockfish*" -exec cp {} ./${{ matrix.sf_dest }} \;
          chmod +x ./${{ matrix.sf_dest }} || true
        shell: bash

      # --- 2. COMPILE NATIVE LIBRARIES ---
      - name: Compile Library Module
        run: |
          python -c "
          from setuptools import setup, Extension
          from Cython.Build import cythonize
          import sys
          
          setup(
              ext_modules=cythonize(Extension('makechessbetter', ['src/bot.py'])),
              script_args=['build_ext', '--inplace']
          )
          "

      # --- 3. COMPILE APPS (Clean System Build Mode) ---
      - name: Build Standalone Application
        run: |
          pyinstaller --onedir \
            --name=${{ matrix.pyi_name }} \
            --paths=. \
            --paths=src \
            --hidden-import=dotenv \
            src/bot.py
        shell: bash

      # --- 4. FORMAT AND STAGE ASSETS FOR UPLOAD ---
      - name: Stage Assets
        shell: bash
        run: |
          mkdir -p output
          
          # 1. Safely copy the executable contents and _internal folder
          if [ -d "dist/${{ matrix.pyi_name }}" ]; then
            cp -RL dist/${{ matrix.pyi_name }}/* output/ 2>/dev/null || cp -R dist/${{ matrix.pyi_name }}/. output/
          fi
          
          # 2. Force your native Cython module next to the app
          find . -name "makechessbetter*${{ matrix.lib_ext }}" -exec cp {} output/ \;
          
          # 3. Inject the compiled Stockfish binary directly into the layout folder root
          if [ -f "${{ matrix.sf_dest }}" ]; then
            cp ${{ matrix.sf_dest }} output/
          fi
          
          # 4. CRITICAL: Copy the config tree directly to the root desktop layout
          if [ -d "config" ]; then
            cp -r config output/config
          fi

      # --- 5. UPLOAD USER-READY DISTRIBUTION FOLDER ---
      - name: Upload Finished Assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: output/
          if-no-files-found: error
