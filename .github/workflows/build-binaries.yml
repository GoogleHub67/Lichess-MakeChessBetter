name: Build All 6 Cross-Platform Chess Assets
on: [push, workflow_dispatch]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: windows-assets
            target_os: windows
            pyi_name: makechessbetter
            binary_ext: .exe
            lib_ext: .pyd
          - os: ubuntu-latest
            artifact_name: linux-assets
            target_os: linux
            pyi_name: makechessbetter-linux
            binary_ext: ''
            lib_ext: .so
          - os: macos-latest
            artifact_name: macos-assets
            target_os: macos
            pyi_name: makechessbetter-mac
            binary_ext: ''
            lib_ext: .so

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Add the MSVC compiler specifically for Windows runners so Cython works
      - name: Set up MSVC (Windows Only)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # --- INSTALL DEPENDENCIES ---
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cython setuptools python-dotenv
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f src/requirements.txt ]; then pip install -r src/requirements.txt; fi
        shell: bash

      # --- 1. COMPILE NATIVE LIBRARIES ---
      - name: Compile Library Module
        run: |
          python -c "
          from setuptools import setup, Extension
          from Cython.Build import cythonize
          import sys
          
          setup(
              ext_modules=cythonize(Extension('makechessbetter', ['src/bot.py'])),
              script_args=['build_ext', '--inplace']
          )
          "

      # --- 2. COMPILE APPS (Clean System Build Mode) ---
      # Adding --paths=. explicitly preserves the top-level folder layout context for internal submodules
      - name: Build Standalone Application
        run: |
          pyinstaller --onedir \
            --name=${{ matrix.pyi_name }} \
            --paths=. \
            --paths=src \
            --hidden-import=dotenv \
            src/bot.py
        shell: bash

      # --- 3. FORMAT AND STAGE ASSETS FOR UPLOAD ---
      - name: Stage Assets
        shell: bash
        run: |
          mkdir -p output
          
          # 1. Safely copy the executable contents and _internal folder without wildcard errors
          if [ -d "dist/${{ matrix.pyi_name }}" ]; then
            cp -RL dist/${{ matrix.pyi_name }}/* output/ 2>/dev/null || cp -R dist/${{ matrix.pyi_name }}/. output/
          fi
          
          # 2. Force your native Cython module next to the app
          find . -name "makechessbetter*${{ matrix.lib_ext }}" -exec cp {} output/ \;
          
          # 3. CRITICAL: Copy the config tree directly to the root desktop layout
          if [ -d "config" ]; then
            cp -r config output/config
          fi

      # --- 4. UPLOAD USER-READY DISTRIBUTION FOLDER ---
      - name: Upload Finished Assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: output/
          if-no-files-found: error
