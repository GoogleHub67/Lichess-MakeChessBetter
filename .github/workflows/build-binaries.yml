name: Build All Cross-Platform Chess Assets
on: [push, workflow_dispatch]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: windows-assets
            target_os: windows
            pyi_name: makechessbetter
            binary_ext: .exe
            lib_ext: .pyd
            sf_url: "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-windows-x86-64-universal.zip"
            sf_dest: "stockfish.exe"
          - os: ubuntu-latest
            artifact_name: linux-assets
            target_os: linux
            pyi_name: makechessbetter-linux
            binary_ext: ''
            lib_ext: .so
            sf_url: "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz"
            sf_dest: "stockfish"
          - os: macos-latest
            artifact_name: macos-assets
            target_os: macos
            pyi_name: makechessbetter-mac
            binary_ext: ''
            lib_ext: .so
            sf_url: "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-macos-universal.tar.gz"
            sf_dest: "stockfish"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Activates the C++ Compiler Environment to handle Cythonization on Windows hosts natively
      - name: Set up MSVC (Windows Only)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # --- INSTALL DEPENDENCIES ---
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cython setuptools python-dotenv
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f src/requirements.txt ]; then pip install -r src/requirements.txt; fi
        shell: bash

      # --- 1. DOWNLOAD AND EXTRACT STOCKFISH 19 ---
      # Automatically collapses URL formatting spaces before fetching to bypass runner terminal parser quirks
      - name: Fetch Cross-Platform Stockfish Engine
        run: |
          mkdir -p sf_temp
          CLEAN_URL=$(echo "${{ matrix.sf_url }}" | tr -d ' ')
          curl -Lf "$CLEAN_URL" -o sf_temp/sf_archive
          
          python -c "
          import zipfile, tarfile, os
          archive = 'sf_temp/sf_archive'
          if zipfile.is_zipfile(archive):
              with zipfile.ZipFile(archive, 'r') as z:
                  z.extractall('sf_temp/')
          else:
              with tarfile.open(archive, 'r:gz') as t:
                  t.extractall('sf_temp/')
          "
          
          # Locates the unpacked universal engine recursively inside the sandbox folders
          find sf_temp -type f \( -name "stockfish*" -o -name "*.exe" \) -exec cp {} ./${{ matrix.sf_dest }} \;
          chmod +x ./${{ matrix.sf_dest }} || true
        shell: bash

      # --- 2. COMPILE NATIVE LIBRARIES ---
      # Cythonizes your core module layout securely
      - name: Compile Library Module
        run: |
          python -c "
          from setuptools import setup, Extension
          from Cython.Build import cythonize
          import sys
          
          setup(
              ext_modules=cythonize(Extension('makechessbetter', ['src/bot.py'])),
              script_args=['build_ext', '--inplace']
          )
          "

      # --- 3. COMPILE APPS (Clean System Build Mode) ---
      # Incorporates absolute workspace mapping paths to completely clear 'src' tracking bugs
      - name: Build Standalone Application
        run: |
          pyinstaller --onedir \
            --name=${{ matrix.pyi_name }} \
            --paths=. \
            --paths=src \
            --hidden-import=dotenv \
            src/bot.py
        shell: bash

      # --- 4. FORMAT AND STAGE ASSETS FOR UPLOAD ---
      - name: Stage Assets
        shell: bash
        run: |
          mkdir -p output
          
          # 1. Safely copy the executable bundle layout without wildcard anomalies
          if [ -d "dist/${{ matrix.pyi_name }}" ]; then
            cp -RL dist/${{ matrix.pyi_name }}/* output/ 2>/dev/null || cp -R dist/${{ matrix.pyi_name }}/. output/
          fi
          
          # 2. Inject your native compiled Cython engine module right next to the executable
          find . -name "makechessbetter*${{ matrix.lib_ext }}" -exec cp {} output/ \;
          
          # 3. Inject the extracted Stockfish 19 binary directly into the build root folder
          if [ -f "${{ matrix.sf_dest }}" ]; then
            cp ${{ matrix.sf_dest }} output/
          fi
          
          # 4. Append configuration tree profiles natively
          if [ -d "config" ]; then
            cp -r config output/config
          fi

      # --- 5. UPLOAD USER-READY DISTRIBUTION FOLDER ---
      # Corrected deprecated upload-artifact syntax parameters
      - name: Upload Finished Assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: output/
          if-no-files-found: error
