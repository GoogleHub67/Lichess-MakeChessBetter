name: Build All 6 Cross-Platform Chess Assets
on: [push, workflow_dispatch]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: windows-assets
            target_os: windows
            pyi_name: makechessbetter
            binary_ext: .exe
            lib_ext: .pyd
          - os: ubuntu-latest
            artifact_name: linux-assets
            target_os: linux
            pyi_name: makechessbetter-linux
            binary_ext: ''
            lib_ext: .so
          - os: macos-latest
            artifact_name: macos-assets
            target_os: macos
            pyi_name: makechessbetter-mac
            binary_ext: ''
            lib_ext: .so

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Add python-dotenv here so PyInstaller can trace and bundle it!
          pip install pyinstaller python-dotenv
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      # --- 1. COMPILE NATIVE LIBRARIES ---
      # Compiles your core logic into native binaries
      - name: Compile Library Module
        run: |
          python -c "
          from setuptools import setup, Extension
          from Cython.Build import cythonize
          import sys
          
          setup(
              ext_modules=cythonize(Extension('makechessbetter', ['src/bot.py'])),
              script_args=['build_ext', '--inplace']
          )
          "

      # --- 2. COMPILE APPS (Clean System Build Mode) ---
      # Removing --add-data flags prevents internal sandboxing.
      # The app will look natively in the root directory it is launched from.
      - name: Build Standalone Application
        run: |
          pyinstaller --onedir \
            --name=${{ matrix.pyi_name }} \
            --paths=src \
            src/bot.py
        shell: bash

      # --- 3. FORMAT AND STAGE ASSETS FOR UPLOAD (Non-Dev Layout Fix) ---
      # This step repositions your folder tree so it is visible to users.
      # It pulls files out of internal zones and structures them clearly on the desktop.
      - name: Stage Assets
        shell: bash
        run: |
          mkdir -p output
          
          # 1. Copy the executable and its system dependencies folder (_internal)
          if [ -d "dist/${{ matrix.pyi_name }}" ]; then
            cp -r dist/${{ matrix.pyi_name }}/* output/
          fi
          
          # 2. Force your native Cython module next to the app
          find . -maxdepth 1 -name "makechessbetter*${{ matrix.lib_ext }}" -exec cp {} output/ \;
          
          # 3. CRITICAL: Copy the config tree directly to the root desktop layout
          # This places the config folder right next to your .exe file, outside _internal!
          if [ -d "config" ]; then
            cp -r config output/config
          fi

      # --- 4. UPLOAD USER-READY DISTRIBUTION FOLDER ---
      - name: Upload Finished Assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: output/
          if-no-files-found: error
