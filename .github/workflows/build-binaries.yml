name: Build All 6 Cross-Platform Chess Assets
on: [push, workflow_dispatch]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: windows-assets
            target_os: windows
            pyi_name: makechessbetter
            binary_ext: .exe
            lib_ext: .pyd
            sep: ';'
          - os: ubuntu-latest
            artifact_name: linux-assets
            target_os: linux
            pyi_name: makechessbetter-linux
            binary_ext: ''
            lib_ext: .so
            sep: ':'
          - os: macos-latest
            artifact_name: macos-assets
            target_os: macos
            pyi_name: makechessbetter-mac
            binary_ext: ''
            lib_ext: .so
            sep: ':'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cython setuptools
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      # --- 1. COMPILE NATIVE LIBRARIES (Outputs to project root) ---
      - name: Compile Library Module
        run: |
          python -c "
          from setuptools import setup, Extension
          from Cython.Build import cythonize
          import sys
          
          setup(
              ext_modules=cythonize(Extension('makechessbetter', ['src/bot.py'])),
              script_args=['build_ext', '--inplace']
          )
          "

      # --- 2. COMPILE STANDALONE APPS ---
      # Updated --add-data to grab everything under config/ recursively
      - name: Build Standalone Application
        run: |
          pyinstaller --onefile \
            --name=${{ matrix.pyi_name }} \
            --paths=src \
            --paths=config \
            --add-data="config/*${{ matrix.sep }}config" \
            src/bot.py
        shell: bash

      # --- 3. FORMAT AND STAGE ASSETS FOR UPLOAD ---
      - name: Stage Assets
        shell: bash
        run: |
          mkdir -p output
          
          # Map the actual produced file from PyInstaller
          PRODUCED_BIN="dist/${{ matrix.pyi_name }}${{ matrix.binary_ext }}"
          
          # Stage the PyInstaller Standalone Executable
          if [ -f "$PRODUCED_BIN" ]; then
            cp "$PRODUCED_BIN" "output/${{ matrix.pyi_name }}${{ matrix.binary_ext }}"
          else
            echo "Error: Executable asset ($PRODUCED_BIN) not found!" && exit 1
          fi
          
          # Stage an external copy of the config directory for explicit user convenience
          if [ -d "config" ]; then
            cp -r config output/config
          fi
          
          # Stage the Native Extension preserving the crucial python platform tags
          find . -maxdepth 1 -name "makechessbetter*${{ matrix.lib_ext }}" -exec cp {} output/ \;

      # --- 4. UPLOAD ZIP ARTIFACTS ---
      - name: Upload Finished Assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: output/
          if-no-files-found: error
