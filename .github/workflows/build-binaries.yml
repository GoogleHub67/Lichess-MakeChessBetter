name: Build Cross-Platform Binaries
on: [push, workflow_dispatch]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: windows-binary
          - os: macos-latest
            artifact_name: macos-binary

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Compilers and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compile Application (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --onefile --name=makechessbetter src/bot.py

      - name: Compile Application (macOS)
        if: matrix.os == 'macos-latest'
        run: pyinstaller --onefile --name=makechessbetter-mac src/bot.py

      - name: Upload Finished Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
