# ruff.toml

# Only check for critical syntax and runtime errors
[lint]
select = ["E9", "F63", "F7", "F82"]

# Ignore all minor style warnings, unused imports, and f-string issues
ignore = [
    "F401", # Ignore unused imports
    "F541", # Ignore empty f-strings
    "I",    # Ignore import sorting rules
    "E",    # Ignore standard styling/spacing rules
    "W",    # Ignore style warnings
]
