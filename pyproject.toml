[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MakeChessBetter"
version = "2.0.1"
description = "My adaptive Lichess bot packaged as a library"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "chess>=1.10.0",
    "httpx>=0.27.0",
    "flask==3.0.3",
    "pyyaml",
    "gunicorn",
    "requests",
    "python-dotenv",
    "berserk>=0.11.0",
    "gevent",
    "sphinx-rtd-theme",
    "myst-parser"
]

[project.scripts]
inappropriate-bot = "Lichess_MakeChessBetter:LichessBot"

[tool.setuptools]
# Map the root directories for your modules and packages
package-dir = { "" = "src", "bot_config" = "config" }
packages = ["Lichess_MakeChessBetter"]
py-modules = ["game_handler"]

# Force setuptools to look inside the config folder for non-Python data files
[tool.setuptools.package-data]
bot_config = ["*.yml", "*.yaml"]
