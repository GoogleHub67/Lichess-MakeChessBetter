[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MakeChessBetter"
version = "2.0.1"
description = "My adaptive Lichess bot packaged as a library"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "chess>=1.10.0",
    "httpx>=0.27.0",
    "flask==3.0.3",
    "gunicorn",
    "python-dotenv",
    "berserk",
    "gevent",
    "sphinx-rtd-theme",
    "myst-parser"
]

[project.scripts]
inappropriate-bot = "MakeChessBetter.bot:main"

[tool.setuptools.packages.find]
where = ["src"]
