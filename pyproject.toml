[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MakeChessBetter"
version = "3.0.0"
description = "My adaptive Lichess bot packaged as a library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "berserk>=0.11.0",
    "chess>=1.10.0",
    "dotenv",
    "flask>=3.1.3",       # Upgraded from 3.0.3 based on your rules
    "gevent",
    "gunicorn",
    "httpx>=0.27.0",
    "myst-parser",
    "pandas",
    "python-dotenv",
    "pyyaml",
    "requests",
    "sphinx-rtd-theme",
    "streamlit"
]

[project.scripts]
inappropriate-bot = "Lichess_MakeChessBetter:LichessBot"

[tool.setuptools]
package-dir = { "" = "src", "bot_config" = "config" }
packages = ["Lichess_MakeChessBetter"]
py-modules = ["game_handler"]

[tool.setuptools.package-data]
bot_config = ["*.yml", "*.yaml"]

# --- MOVED FROM PIPFILE [dev-packages] ---
[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-mock",
    "ruff"
]

# --- MOVED FROM PYTEST.INI (FIXED STRING-ARRAY TOML SYNTAX) ---
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [".git", ".github", ".vscode", ".venv", "venv", "build", "dist"]
filterwarnings = [
    "ignore::DeprecationWarning"
]
