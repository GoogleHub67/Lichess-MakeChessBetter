[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MakeChessBetter"
version = "2.0.1"
description = "My adaptive Lichess bot packaged as a library"
readme = "README.md"
requires-python = ">=3.10" # Updated to 3.10 to match your Pipfile's requirement
dependencies = [
    "chess>=1.10.0",
    "httpx>=0.27.0",
    "flask>=3.1.3",
    "pyyaml",
    "gunicorn",
    "requests",
    "python-dotenv",
    "berserk>=0.11.0",
    "gevent",
    "sphinx-rtd-theme",
    "myst-parser",
    "pandas",
    "streamlit"
]

[project.scripts]
inappropriate-bot = "Lichess_MakeChessBetter:LichessBot"

[tool.setuptools]
package-dir = { "" = "src", "bot_config" = "config" }
packages = ["Lichess_MakeChessBetter"]
py-modules = ["game_handler"]

[tool.setuptools.package-data]
bot_config = ["*.yml", "*.yaml"]

# --- MOVED FROM PIPFILE [dev-packages] ---
[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-mock",
    "ruff"
]

# --- MOVED FROM PYTEST.INI ---
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = "test_*.py *_test.py"
python_classes = "Test*"
python_functions = "test_*"
norecursedirs = ".git .github .vscode .venv venv build dist"
filterwarnings = [
    "ignore::DeprecationWarning"
]
