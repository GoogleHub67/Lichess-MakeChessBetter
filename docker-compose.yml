version: '3.8'

services:
  chess-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: make_chess_better_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - chess_data:/app/data
    stdin_open: true
    tty: true

volumes:
  chess_data:
    driver: local
